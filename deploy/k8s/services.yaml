# 玄冥纯 Python 全量 23 个业务服务 Kubernetes 清单（Deployment + ClusterIP Service）
# 全部容器强制非 root（UID/GID 10001）、只读根文件系统、禁用提权、资源配额、健康探针及 SecretKeyRef 注入。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: xuanming
  labels:
    app: portal
    app.kubernetes.io/part-of: xuanming-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
        app.kubernetes.io/part-of: xuanming-python
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: portal
          image: xuanming-python:latest
          imagePullPolicy: IfNotPresent
          args: ["portal", "--config", "/app/config/portal.example.toml"]
          ports:
            - name: http
              containerPort: 8080
            - name: mgmt
              containerPort: 8082
          env:
            - name: XUANMING_PORTAL_MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xuanming-secrets
                  key: portal-mysql-password
            - name: XUANMING_PORTAL_CDN_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: xuanming-secrets
                  key: portal-cdn-signing-secret
            - name: XUANMING_PORTAL_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xuanming-secrets
                  key: portal-admin-api-key
            - name: COMMERCE_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: xuanming-secrets
                  key: commerce-admin-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal
  namespace: xuanming
  labels:
    app: portal
spec:
  type: ClusterIP
  selector:
    app: portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: mgmt
      port: 8082
      targetPort: 8082
---
